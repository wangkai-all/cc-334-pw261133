<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>报表采集器</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 360px; margin: 12px; }
    label { display: block; margin: 6px 0 2px; color: #555; }
    input { width: 100%; box-sizing: border-box; padding: 4px; }
    h2 { font-size: 14px; margin: 12px 0 4px; }
    .ok { color: #1a7f37; } .bad { color: #b42318; }
    pre { background: #f5f5f5; padding: 6px; max-height: 220px; overflow: auto; font-size: 11px; }
  </style>
</head>
<body>
  <h2>服务地址</h2>
  <label>门户</label><input id="portalUrl" value="http://127.0.0.1:8080">
  <label>采集器</label><input id="collectorUrl" value="http://127.0.0.1:8090">
  <button id="save">保存</button> <span id="saved" class="ok"></span>
  <h2>最近下载（按 download_id 关联，不按文件名）</h2>
  <pre id="history">加载中…</pre>
  <script src="popup.js" type="module"></script>
</body>
</html>
